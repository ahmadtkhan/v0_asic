# Tiny Tapeout project information
project:
  title:        "V0 asic"      # Project title
  author:       "Ahmad Khan"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Initial version 0 of Emulator ASIC currently supporting operations for SPI, I2C and UART"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocol_top"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_protocol_top.v"
    - "protocol_top.v"
    - "protocol_core.v"
    - "proto_tick.v"
    - "proto_shift.v"
    - "proto_gpio.v"
    - "proto_fifo.v"
    - "instruction_memory.v"
    - "instruction_decoder.v"
    - "config_regs.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  ui[0]: "HOST_ARG0"
  ui[1]: "HOST_ARG1"
  ui[2]: "HOST_ARG2"
  ui[3]: "HOST_SHOW_RX"
  ui[4]: "HOST_CMD0"
  ui[5]: "HOST_CMD1"
  ui[6]: "HOST_CMD2"
  ui[7]: "HOST_STROBE"

  uo[0]: "BUSY / RX_DATA0"
  uo[1]: "FAULT / RX_DATA1"
  uo[2]: "PROG_READY / RX_DATA2"
  uo[3]: "CFG_READY / RX_DATA3"
  uo[4]: "TX_FULL / RX_DATA4"
  uo[5]: "RX_EMPTY / RX_DATA5"
  uo[6]: "0 / RX_DATA6"
  uo[7]: "0 / RX_DATA7"

  uio[0]: "GPIO0 / HOST_DATA0"
  uio[1]: "GPIO1 / HOST_DATA1"
  uio[2]: "GPIO2 / HOST_DATA2"
  uio[3]: "GPIO3 / HOST_DATA3"
  uio[4]: "GPIO4 / HOST_DATA4"
  uio[5]: "GPIO5 / HOST_DATA5"
  uio[6]: "GPIO6 / HOST_DATA6"
  uio[7]: "GPIO7 / HOST_DATA7"
# Do not change!
yaml_version: 6
